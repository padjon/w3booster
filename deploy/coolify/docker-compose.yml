name: w3booster

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  master:
    image: ghcr.io/padjon/w3booster-master:${W3BOOSTER_IMAGE_TAG:-main}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      config: ${W3BOOSTER_MASTER_CONFIG:-prod}
      MONGOLAB_URI: ${W3BOOSTER_MONGODB_URI:-mongodb://mongo:27017/w3booster}
      PARSE_SERVER_URL: ${W3BOOSTER_PARSE_SERVER_URL:-https://api.preview.w3booster.com}
      PARSE_MOUNT: ${W3BOOSTER_PARSE_MOUNT:-/parse}
      PORT: ${W3BOOSTER_MASTER_PORT:-15469}
      OVERLAY_BROADCAST_PORT: ${W3BOOSTER_OVERLAY_BROADCAST_PORT:-15470}
      HTTPS_KEY_PATH: ${W3BOOSTER_HTTPS_KEY_PATH:-/run/w3booster-certs/preview.w3booster.com-le.key}
      HTTPS_CERT_PATH: ${W3BOOSTER_HTTPS_CERT_PATH:-/run/w3booster-certs/preview.w3booster.com-le.crt}
      OVERLAY_HTTPS_KEY_PATH: ${W3BOOSTER_OVERLAY_HTTPS_KEY_PATH:-/run/w3booster-certs/preview.w3booster.com-le.key}
      OVERLAY_HTTPS_CERT_PATH: ${W3BOOSTER_OVERLAY_HTTPS_CERT_PATH:-/run/w3booster-certs/preview.w3booster.com-le.crt}
    volumes:
      - /var/www/preview.w3booster.com/ssl:/run/w3booster-certs:ro
    ports:
      - "${W3BOOSTER_MASTER_HTTP_BIND:-127.0.0.1:15469}:${W3BOOSTER_MASTER_PORT:-15469}"
      - "${W3BOOSTER_MASTER_OVERLAY_BIND:-127.0.0.1:15470}:${W3BOOSTER_OVERLAY_BROADCAST_PORT:-15470}"

  client:
    image: ghcr.io/padjon/w3booster-client:${W3BOOSTER_IMAGE_TAG:-main}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - master
    environment:
      W3BOOSTER_PUBLIC_REST_URL: ${W3BOOSTER_PUBLIC_REST_URL:-https://api.preview.w3booster.com/}
      W3BOOSTER_PUBLIC_PARSE_URL: ${W3BOOSTER_PUBLIC_PARSE_URL:-https://api.preview.w3booster.com/parse}
      W3BOOSTER_PUBLIC_PARSE_APP_ID: ${W3BOOSTER_PUBLIC_PARSE_APP_ID:-PSBdEx46ycVok7grEcdOMKPMsLYUl1OZ}
      W3BOOSTER_PUBLIC_PARSE_JS_KEY: ${W3BOOSTER_PUBLIC_PARSE_JS_KEY:-stnDsBFS854z78FSBFu36bscjxhbv}
      W3BOOSTER_PUBLIC_LIVESERVER_URL: ${W3BOOSTER_PUBLIC_LIVESERVER_URL:-https://preview.w3booster.com:15470/}
      W3BOOSTER_PUBLIC_MATCH_UPDATE_WSS_URL: ${W3BOOSTER_PUBLIC_MATCH_UPDATE_WSS_URL:-wss://preview.w3booster.com:15470}
    ports:
      - "${W3BOOSTER_CLIENT_BIND:-127.0.0.1:15420}:8080"

  overlay:
    image: ghcr.io/padjon/w3booster-overlay:${W3BOOSTER_IMAGE_TAG:-main}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - master
    environment:
      W3BOOSTER_PUBLIC_OVERLAY_RECORDER_WSS_URL: ${W3BOOSTER_PUBLIC_OVERLAY_RECORDER_WSS_URL:-wss://preview.w3booster.com:15470}
    ports:
      - "${W3BOOSTER_OVERLAY_BIND:-127.0.0.1:15480}:8080"

  parse-dashboard:
    image: parseplatform/parse-dashboard:latest
    restart: unless-stopped
    depends_on:
      - master
    environment:
      PARSE_DASHBOARD_ALLOW_INSECURE_HTTP: ${PARSE_DASHBOARD_ALLOW_INSECURE_HTTP:-true}
      PARSE_DASHBOARD_SERVER_URL: ${PARSE_DASHBOARD_SERVER_URL:-https://api.preview.w3booster.com/parse}
      PARSE_DASHBOARD_MASTER_KEY: ${W3BOOSTER_PARSE_MASTER_KEY}
      PARSE_DASHBOARD_APP_ID: ${W3BOOSTER_PARSE_APP_ID:-PSBdEx46ycVok7grEcdOMKPMsLYUl1OZ}
      PARSE_DASHBOARD_APP_NAME: ${PARSE_DASHBOARD_APP_NAME:-W3Booster}
      PARSE_DASHBOARD_USER_ID: ${PARSE_DASHBOARD_USER_ID}
      PARSE_DASHBOARD_USER_PASSWORD: ${PARSE_DASHBOARD_USER_PASSWORD}
      MOUNT_PATH: ${PARSE_DASHBOARD_MOUNT_PATH:-/dashboard/}
    ports:
      - "${PARSE_DASHBOARD_BIND:-127.0.0.1:15440}:4040"

volumes:
  mongo-data:
