<!doctype html>
<html lang="en" style="background-color: #0d0e12; height:100%">

<head>
  <meta charset="utf-8">
  <title>W3Booster | Next Level Warcraft III Streaming</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/svg+xml" href="assets/images/icon.svg">
  <meta name="theme-color" content="#7c5cfc" />
  <link rel="manifest" href="./manifest.json" />
  <!--<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css" integrity="sha384-50oBUHEmvpQ+1lW4y57PTFmhCaXp0ML5d60M1M7uH2+nqUivzIebhndOJK28anvf" crossorigin="anonymous">-->
  <script src="./runtime-config.js"></script>
  <script defer src="https://use.fontawesome.com/releases/v5.15.4/js/all.js" integrity="sha384-rOA1PnstxnOBLzCLMcre8ybwbTmemjzdNlILg8O7z1lUkLXozs4DHonlDtnE7fpc" crossorigin="anonymous"></script>

  <script>
    // socket.io fix
    window.global = window;
  </script>
</head>
<style>
circle-progress text{
  transform: translate(2px,4px);
  }

  .boot-landing {
    background:
      radial-gradient(circle at 15% 10%, rgba(124, 92, 252, 0.12), transparent 30rem),
      radial-gradient(circle at 88% 8%,  rgba(160, 142, 255, 0.06), transparent 24rem),
      linear-gradient(135deg, #0d0e12 0%, #111215 48%, #0d0e12 100%);
    color: #eaeaec;
    font-family: "Inter", "Segoe UI", "Trebuchet MS", sans-serif;
    min-height: 100vh;
    overflow: hidden;
    padding: 64px 28px;
  }

  .boot-landing__inner {
    background: linear-gradient(135deg, rgba(28, 29, 35, 0.92), rgba(17, 18, 21, 0.96));
    border: 1px solid rgba(160, 142, 255, 0.22);
    border-radius: 12px;
    box-shadow: 0 32px 90px rgba(0, 0, 0, 0.52);
    margin: 0 auto;
    max-width: 1180px;
    min-height: 520px;
    padding: 56px;
  }

  .boot-landing__logo {
    display: block;
    margin-bottom: 72px;
    width: 160px;
    height: auto;
  }

  .boot-landing__eyebrow {
    color: #a08eff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    margin-bottom: 18px;
    text-transform: uppercase;
  }

  .boot-landing h1 {
    color: #ffffff;
    font-size: clamp(38px, 6vw, 72px);
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1.02;
    margin: 0 0 24px;
    max-width: 760px;
  }

  .boot-landing p {
    color: #bdbec7;
    font-size: 18px;
    line-height: 1.7;
    margin: 0 0 32px;
    max-width: 660px;
  }

  .boot-landing__actions {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }

  .boot-landing__actions a {
    border-radius: 6px;
    color: #fff;
    font-weight: 800;
    letter-spacing: 0.08em;
    padding: 15px 22px;
    text-decoration: none;
    text-transform: uppercase;
  }

  .boot-landing__primary {
    background: linear-gradient(160deg, #7c5cfc, #4730c0);
    box-shadow: 0 16px 28px rgba(99, 71, 232, 0.42);
  }

  .boot-landing__secondary {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(160, 142, 255, 0.28);
  }

  @media (max-width: 860px) {
    .boot-landing {
      padding: 18px;
    }

    .boot-landing__inner {
      padding: 32px 22px;
    }
  }
  </style>
<body>
  <noscript>
    <p>This page requires JavaScript to work properly. Please enable JavaScript in your browser.</p>
  </noscript>
  <app-root>
    <main class="boot-landing">
      <section class="boot-landing__inner">
        <img class="boot-landing__logo" src="assets/images/logo.svg" alt="W3Booster" />
        <div class="boot-landing__eyebrow">Warcraft III streaming command center</div>
        <h1>One W3Booster. Desktop power. Web access.</h1>
        <p>
          W3Booster is loading the web client. If your browser keeps showing this screen,
          refresh once to replace an older cached build.
        </p>
        <div class="boot-landing__actions">
          <a class="boot-landing__primary" href="https://w3booster.com/w3booster.msi">Download Windows client</a>
          <a class="boot-landing__secondary" href="/login">Login in browser</a>
        </div>
      </section>
    </main>
  </app-root>

</body>

</html>
