<svg width="172" height="44" viewBox="0 0 172 44" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="W3Booster">
  <title>W3Booster</title>
  <defs>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9b87ff"/>
      <stop offset="100%" stop-color="#4730c0"/>
    </linearGradient>
  </defs>
  <!-- Icon mark: cut-corner octagon -->
  <path d="M10,2 L34,2 L42,10 L42,34 L34,42 L10,42 L2,34 L2,10 Z" fill="url(#iconGrad)"/>
  <!-- Top-right shine -->
  <path d="M20,2 L34,2 L42,10 Z" fill="rgba(255,255,255,0.14)"/>
  <!-- W letterform -->
  <polyline
    points="9,14 15,31 22,21 29,31 35,14"
    fill="none" stroke="white" stroke-width="3.6"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- "3" superscript -->
  <text x="31" y="16"
    font-family="'Inter','Segoe UI',system-ui,sans-serif"
    font-size="9" font-weight="800" fill="rgba(255,255,255,0.88)">3</text>
  <!-- Wordmark: W3 -->
  <text x="54" y="22"
    font-family="'Inter','Segoe UI',system-ui,sans-serif"
    font-size="18" font-weight="800" fill="white" letter-spacing="-0.5">W3</text>
  <!-- Wordmark: BOOSTER -->
  <text x="55" y="38"
    font-family="'Inter','Segoe UI',system-ui,sans-serif"
    font-size="11" font-weight="700" fill="#a08eff" letter-spacing="3">BOOSTER</text>
</svg>
