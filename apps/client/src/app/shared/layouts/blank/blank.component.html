<!-- ============================================================== -->
<!-- Only router without any element -->
<!-- ============================================================== -->
<style>
  #dragbar {
    -webkit-app-region: drag;
    cursor: move;
    background: transparent;
    height: 34px;
    position: absolute;
  }

  #dragbar a {
    -webkit-app-region: no-drag;
  }


  #close {
    color: #fff;
    position: absolute;
    top: 6px;
    right: 6px;
    -webkit-app-region: no-drag;
    cursor: pointer;
  }

  #minimize {
    color: #fff;
    position: absolute;
    top: 6px;
    right: 28px;
    -webkit-app-region: no-drag;
    cursor: pointer;
    font-size: 12px;
  }

  #maximize {
    color: #fff;
    position: absolute;
    top: 6px;
    right: 50px;
    -webkit-app-region: no-drag;
    cursor: pointer;
    font-size: 12px;
  }

  #close:hover,
  #minimize:hover,
  #maximize:hover {
    cursor: pointer;
    color: #999 !important;
  }

  a:hover {
    text-decoration: none;
  }

  .blank-shell {
    background: #fff;
    min-height: 100vh;
    min-width: 0;
    position: relative;
    width: 100%;
  }

  .blank-shell--native {
    height: 100%;
    min-height: 480px;
    min-width: 320px;
  }

  .blank-content {
    min-height: 100vh;
  }

  .blank-shell--native .blank-content {
    bottom: 0;
    left: 0;
    min-height: 0;
    position: absolute;
    right: 0;
    top: 34px;
  }
</style>

<div class="blank-shell" [class.blank-shell--native]="isNativeShell">
  <div *ngIf="isNativeShell" style="width: 100%; padding: 24px 20px 4px 0px; background: #202829;" id="dragbar">
    <div style="position:absolute; top:5px; left: 10px;"><img src="assets/images/logo.png" style="width:96px" /></div>
    <div id="minimize" (click)="minimizeWindow()"><span class="fa fa-window-minimize"></span></div>
    <div id="maximize" (click)="toggleWindowMaximize()"><span class="fa fa-window-maximize"></span></div>
    <div id="close" (click)="closeWindow()"><span class="fa fa-window-close"></span></div>
    <span style="position: absolute; right:74px; top:12px; font-size:9px; color:#fff"><span style="color:#fff">Made
        with
        <span class="fa fa-heart" style="color: #dba7b1"></span> by Pad &nbsp;|</span>&nbsp; v{{version}}</span>
  </div>
  <div class="blank-content">
    <router-outlet></router-outlet>
  </div>
</div>
