<div class="persona-toggle" aria-label="Persona">
    <button type="button"
            [class.is-active]="state?.persona !== 'streamer'"
            (click)="setPersona('player')">
        Player
    </button>
    <button type="button"
            [class.is-active]="state?.persona === 'streamer'"
            (click)="setPersona('streamer')">
        Streamer
    </button>
</div>
