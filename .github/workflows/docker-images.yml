name: Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  docker:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            image: ghcr.io/padjon/w3booster-client
            dockerfile: apps/client/Dockerfile
            build-args: |
              BUILD_CONFIGURATION=prod
          - name: master
            image: ghcr.io/padjon/w3booster-master
            dockerfile: apps/master/Dockerfile
            build-args: ""
          - name: overlay
            image: ghcr.io/padjon/w3booster-overlay
            dockerfile: apps/overlay/Dockerfile
            build-args: |
              BUILD_CONFIGURATION=production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy-preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Restart Coolify preview service
        id: restart-preview
        continue-on-error: true
        env:
          COOLIFY_PREVIEW_RESTART_URL: ${{ secrets.COOLIFY_PREVIEW_RESTART_URL }}
          COOLIFY_PREVIEW_API_RESTART_URL: ${{ secrets.COOLIFY_PREVIEW_API_RESTART_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          for url in "$COOLIFY_PREVIEW_RESTART_URL" "$COOLIFY_PREVIEW_API_RESTART_URL"; do
            if [ -n "$url" ] && curl --fail --show-error --silent --retry 3 --retry-delay 5 \
              --request GET "$url" \
              --header "Authorization: Bearer $COOLIFY_TOKEN"; then
              exit 0
            fi
          done

          echo "No Coolify preview restart endpoint succeeded." >&2
          exit 1
      - name: Recover Coolify preview service
        if: steps.restart-preview.outcome == 'failure'
        env:
          COOLIFY_PREVIEW_START_URL: ${{ secrets.COOLIFY_PREVIEW_START_URL }}
          COOLIFY_PREVIEW_API_START_URL: ${{ secrets.COOLIFY_PREVIEW_API_START_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          sleep 75
          for url in "$COOLIFY_PREVIEW_START_URL" "$COOLIFY_PREVIEW_API_START_URL"; do
            if [ -n "$url" ] && curl --fail --show-error --silent --retry 3 --retry-delay 5 \
              --request GET "$url" \
              --header "Authorization: Bearer $COOLIFY_TOKEN"; then
              exit 0
            fi
          done

          echo "No Coolify preview start endpoint succeeded." >&2
          exit 1
